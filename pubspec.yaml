name: remote_control
description: "Wirehelm, an Android toolkit for SSH, device control and Pixel customization."
publish_to: 'none'

version: 1.38.30+336

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  dartssh2: ^4.1.0
  flutter_secure_storage: ^11.2.0
  pinenacl: ^0.6.0
  shared_preferences: ^2.5.5
  xterm: ^4.0.0

dependency_overrides:
  dartssh2:
    path: third_party/dartssh2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pointycastle: any

flutter:
  uses-material-design: true
  assets:
    - assets/automation/smart_bulb.py
    - assets/desktop/wayland.py
    - assets/desktop/plasma_settings.py
    - assets/licenses/termux.txt
